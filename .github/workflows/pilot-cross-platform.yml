name: Pilot app - Windows Linux macOS
on: [push, pull_request]
jobs:
  pilot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s pilot-app -p "test_*.py"
